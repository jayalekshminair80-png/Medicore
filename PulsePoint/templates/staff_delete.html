{% extends "base.html" %}

{% block content %}
<h1>Delete Staff Member</h1>
<p>Are you sure you want to delete {{ staff_member.full_name }}?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>

<a href="{% url 'staff_list' %}">Cancel</a>
{% endblock %}
