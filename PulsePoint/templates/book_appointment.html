{% extends 'hospital/base.html' %}
{% load static %}

{% block title %}Book Appointment | MediCore{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/book_appointment.css' %}">
{% endblock %}

{% block content %}

<section class="appointment-section">

    <h1>Book an Appointment</h1>
    <p>Schedule your consultation with our doctors.</p>

    <form method="POST">
        {% csrf_token %}

        <label for="doctor">Select Doctor</label>
        <select name="doctor" id="doctor" required>
            <option value="">Choose a doctor</option>
            {% for doctor in doctors %}
            <option value="{{ doctor.id }}">
                Dr. {{ doctor.user.get_full_name }} - {{ doctor.specialization }}
            </option>
            {% endfor %}
        </select>

        <label for="date">Appointment Date</label>
        <input type="date" name="date" id="date" required>

        <label for="time">Appointment Time</label>
        <select name="time" id="time" required>
            <option value="">Select time</option>
            {% for slot in available_slots %}
            <option value="{{ slot }}">{{ slot }}</option>
            {% endfor %}
        </select>

        <label for="reason">Reason for Appointment</label>
        <textarea name="reason" id="reason"
                  placeholder="Describe your concern" required></textarea>

        <button type="submit">Book Appointment</button>

    </form>

</section>

{% endblock %}
