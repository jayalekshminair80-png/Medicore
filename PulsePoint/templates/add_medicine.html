{% extends 'base.html' %}

{% block title %}Add Medicine | MediCore{% endblock %}

{% block content %}
<section class="pharmacy-section">
    <h1>Add Medicine</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Medicine</button>
    </form>

    <p><a href="{% url 'pharmacy' %}">Back to inventory</a></p>
</section>
{% endblock %}
